window.SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* Einladungs- bzw. Reset-Link erkennen, bevor supabase-js den Hash aufräumt */
window.BQ_INVITE = /type=(invite|recovery|signup)/.test(window.location.hash || "")
                || /type=(invite|recovery|signup)/.test(window.location.search || "");

/* ------------------------------------------------------------------ */
/* Speicher: alle Schlüssel liegen in einer Zeile der Tabelle          */
/* attendance. Gelesen wird aus dem Cache, geschrieben entprellt.      */
/* ------------------------------------------------------------------ */
(function () {
  var cache = {};
  var userId = null;
  var timer = null;
  var el = null;
  var hideTimer = null;

  function badge(text, isError) {
    if (!el) el = document.getElementById("bq-save");
    if (!el) return;
    clearTimeout(hideTimer);
    if (!text) { el.className = ""; return; }
    el.textContent = text;
    el.className = isError ? "on err" : "on";
    if (!isError) hideTimer = setTimeout(function () { el.className = ""; }, 1800);
  }

  function flush() {
    if (!userId) return;
    window.SB.from("attendance")
      .upsert({ user_id: userId, data: cache, updated_at: new Date().toISOString() }, { onConflict: "user_id" })
      .then(function (res) {
        if (res.error) {
          badge("Nicht gespeichert", true);
          console.error("Speichern fehlgeschlagen:", res.error);
        } else {
          var d = new Date();
          badge("Gespeichert " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"));
        }
      });
  }

  window.BQStore = {
    pending: false,
    /* Einmal nach der Anmeldung: Zeile laden und in den Cache legen. */
    init: function (id) {
      userId = id;
      return window.SB.from("attendance").select("data").eq("user_id", id).maybeSingle()
        .then(function (res) {
          if (res.error) throw res.error;
          cache = (res.data && res.data.data) || {};
          return true;
        });
    },
    reset: function () { cache = {}; userId = null; clearTimeout(timer); }
  };

  window.storage = {
    get: function (key) {
      return new Promise(function (resolve, reject) {
        if (!(key in cache)) return reject(new Error("not found"));
        resolve({ key: key, value: JSON.stringify(cache[key]), shared: false });
      });
    },
    set: function (key, value) {
      return new Promise(function (resolve) {
        try { cache[key] = JSON.parse(value); } catch (e) { cache[key] = value; }
        badge("Speichert \u2026");
        clearTimeout(timer);
        timer = setTimeout(flush, 700);
        resolve({ key: key, value: value, shared: false });
      });
    },
    delete: function (key) {
      return new Promise(function (resolve) {
        delete cache[key];
        clearTimeout(timer);
        timer = setTimeout(flush, 700);
        resolve({ key: key, deleted: true, shared: false });
      });
    },
    list: function (prefix) {
      return new Promise(function (resolve) {
        var keys = Object.keys(cache).filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
        resolve({ keys: keys, prefix: prefix, shared: false });
      });
    }
  };
})();
</script>
